name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: api

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Lint protobuf
        run: |
          cd api/proto
          buf lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopping_list_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run migrations
        run: |
          goose -dir api/migrations postgres "postgres://postgres:postgres@localhost:5432/shopping_list_test?sslmode=disable" up
        env:
          GOOSE_DRIVER: postgres

      - name: Run unit tests
        run: |
          cd api
          go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: api/coverage.out
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          cd api
          CGO_ENABLED=0 go build -o bin/server ./cmd/server

      - name: Build Docker image
        run: |
          cd api
          docker build -t shopping-list-api:${{ github.sha }} .

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shopping_list_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Run migrations up
        run: |
          goose -dir api/migrations postgres "postgres://postgres:postgres@localhost:5432/shopping_list_migration_test?sslmode=disable" up

      - name: Run migrations down
        run: |
          goose -dir api/migrations postgres "postgres://postgres:postgres@localhost:5432/shopping_list_migration_test?sslmode=disable" down-to 0

      - name: Run migrations up again
        run: |
          goose -dir api/migrations postgres "postgres://postgres:postgres@localhost:5432/shopping_list_migration_test?sslmode=disable" up

  proto-breaking:
    name: Protobuf Breaking Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Check for breaking changes
        run: |
          cd api/proto
          buf breaking --against '.git#branch=main'
